<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UOB IT PMO Board</title>
<style>
  /* ==========================================================
     1. Design tokens (palette, spacing, type)
     ========================================================== */
  :root {
    --blue-900: #0b2a4a;
    --blue-800: #0f3a66;
    --blue-700: #1554a0;
    --blue-500: #2f74c8;
    --blue-100: #e6eef8;
    --blue-50:  #f3f7fc;

    --ink:      #1b2430;
    --ink-2:    #4a5566;
    --ink-3:    #6b7686;
    --line:     #d5dce6;
    --surface:  #ffffff;
    --page:     #eef2f7;

    --p-critical: #c62828;
    --p-high:     #d98a00;
    --p-medium:   #1f6fd1;
    --p-low:      #7a8494;

    --ok:    #1e7d4f;
    --warn:  #9a5b00;
    --error: #b3261e;

    --focus: #ffb000;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --radius:    8px;
    --radius-sm: 4px;
    --shadow:    0 1px 2px rgba(11, 42, 74, .08), 0 2px 6px rgba(11, 42, 74, .06);
    --shadow-lg: 0 12px 32px rgba(11, 42, 74, .25);

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ==========================================================
     2. Base
     ========================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ==========================================================
     3. Buttons & form controls
     ========================================================== */
  .btn {
    display: inline-flex; align-items: center; gap: var(--space-2);
    border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-4);
    font-weight: 600; cursor: pointer;
    background: var(--surface); color: var(--blue-800); border-color: var(--line);
  }
  .btn:hover { background: var(--blue-50); }
  .btn-primary { background: var(--blue-700); color: #fff; border-color: var(--blue-700); }
  .btn-primary:hover { background: var(--blue-800); }
  .btn-light { background: #fff; color: var(--blue-900); border-color: #fff; }
  .btn-light:hover { background: var(--blue-100); }
  .btn[disabled] { opacity: .6; cursor: not-allowed; }
  .btn-sm { padding: 2px var(--space-2); font-size: 12px; }
  .btn-danger { background: var(--p-critical); color: #fff; border-color: var(--p-critical); }
  .btn-danger:hover { background: #a31f1f; }

  .icon-btn {
    border: 0; background: transparent; cursor: pointer;
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    display: inline-grid; place-items: center;
    color: var(--ink-3); font-size: 18px; line-height: 1;
  }
  .icon-btn:hover { background: var(--blue-100); color: var(--ink); }

  input[type="text"], input[type="date"], input[type="search"], select, textarea {
    width: 100%;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    background: var(--surface);
  }
  textarea { resize: vertical; min-height: 80px; }
  [aria-invalid="true"] { border-color: var(--error); }

  /* ==========================================================
     4. Header, wordmark & summary strip
     ========================================================== */
  .app-header {
    background: linear-gradient(90deg, var(--blue-900), var(--blue-700));
    color: #fff;
    padding: var(--space-4) var(--space-5);
  }
  .header-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4);
    justify-content: space-between;
  }
  .wordmark { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .wordmark span { font-weight: 400; opacity: .8; }
  .header-actions { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .sending-indicator { font-size: 12px; opacity: .9; }
  .sending-indicator[hidden] { display: none; }

  .summary {
    display: flex; flex-wrap: wrap; gap: var(--space-2);
    margin: var(--space-4) 0 var(--space-2); padding: 0;
  }
  .summary div {
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: var(--radius-sm);
    padding: var(--space-1) var(--space-3);
    display: flex; align-items: baseline; gap: var(--space-2);
  }
  .summary dt { font-size: 12px; opacity: .85; }
  .summary dd { margin: 0; font-weight: 700; font-size: 16px; }
  .summary .sum-overdue { background: rgba(198, 40, 40, .35); border-color: rgba(255, 180, 180, .5); }
  .demo-note { margin: 0; font-size: 12px; opacity: .8; }

  /* ==========================================================
     5. Filter bar
     ========================================================== */
  main { padding: var(--space-4) var(--space-5) var(--space-6); }
  .filters {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-4); box-shadow: var(--shadow);
  }
  .filters .field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 180px; flex: 1 1 180px; }
  .filters label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .filters .btn { flex: 0 0 auto; }

  /* ==========================================================
     6. Board & columns
     ========================================================== */
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
    align-items: start;
  }
  .column {
    background: var(--blue-50);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    min-height: 240px;
    transition: background-color .12s, border-color .12s;
  }
  .column.is-drop-target {
    background: var(--blue-100);
    border-style: dashed;
    border-color: var(--blue-500);
  }
  .column-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--line);
  }
  .column-header h2 { margin: 0; font-size: 15px; color: var(--blue-900); }
  .column-hint { margin: 2px 0 0; font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .count-badge {
    background: var(--blue-700); color: #fff;
    border-radius: 999px; padding: 2px var(--space-2);
    font-size: 12px; font-weight: 700; min-width: 26px; text-align: center;
  }
  .card-list {
    display: flex; flex-direction: column; gap: var(--space-3);
    padding: var(--space-3); flex: 1;
  }
  .empty { color: var(--ink-3); font-size: 12px; text-align: center; padding: var(--space-4) 0; margin: 0; }

  @media (max-width: 767px) {
    .app-header, main { padding-left: var(--space-4); padding-right: var(--space-4); }
    .board { grid-template-columns: 1fr; }
    .column { min-height: 0; }
  }

  /* ==========================================================
     7. Cards
     ========================================================== */
  .card {
    --prio-color: var(--p-medium);
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--prio-color);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    box-shadow: var(--shadow);
    cursor: grab;
  }
  .card.prio-critical { --prio-color: var(--p-critical); }
  .card.prio-high     { --prio-color: var(--p-high); }
  .card.prio-medium   { --prio-color: var(--p-medium); }
  .card.prio-low      { --prio-color: var(--p-low); }
  .card.is-dragging { opacity: .45; }

  .card-top { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .card-id { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--ink-3); }
  .card-top .icon-btn { margin-left: auto; }
  .card-title { margin: var(--space-2) 0 var(--space-1); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
  .card-desc {
    margin: 0 0 var(--space-2); color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { margin: 0 0 var(--space-2); display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-2); font-size: 12px; }
  .card-meta dt { color: var(--ink-3); }
  .card-meta dd { margin: 0; overflow-wrap: anywhere; }

  .pill, .tag, .badge-overdue {
    display: inline-block; border-radius: 999px;
    padding: 1px var(--space-2); font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .pill { color: #fff; background: var(--prio-color); }
  .card.prio-high .pill { color: #231400; }
  .tag { background: var(--blue-100); color: var(--blue-800); font-weight: 600; }
  .badge-overdue { background: #fdecea; color: var(--p-critical); border: 1px solid #f3b8b3; }

  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
  .move-select {
    width: auto; padding: 2px var(--space-2); font-size: 12px;
    color: var(--blue-800); font-weight: 600; cursor: pointer;
  }
  .confirm-row {
    display: flex; align-items: center; gap: var(--space-2);
    margin-top: var(--space-2); padding: var(--space-2);
    background: #fdecea; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 600; color: var(--p-critical);
  }
  .confirm-row span { margin-right: auto; }

  /* ==========================================================
     8. Add Task dialog
     ========================================================== */
  dialog {
    border: 0; border-radius: var(--radius); padding: 0;
    width: min(560px, calc(100vw - 32px));
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgba(11, 42, 74, .55); }
  .dialog-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-4) var(--space-5);
    background: var(--blue-900); color: #fff;
  }
  .dialog-header h2 { margin: 0; font-size: 17px; }
  .dialog-header .icon-btn { color: #fff; }
  .dialog-header .icon-btn:hover { background: rgba(255, 255, 255, .15); color: #fff; }
  .task-form { padding: var(--space-4) var(--space-5) var(--space-5); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
  .form-grid .full { grid-column: 1 / -1; }
  .form-field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: var(--space-1); }
  .req { color: var(--p-critical); }
  .hint { font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .field-error { color: var(--error); font-size: 12px; margin: var(--space-1) 0 0; min-height: 1em; }
  .form-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }
  @media (max-width: 520px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ==========================================================
     9. Toasts
     ========================================================== */
  .toasts {
    position: fixed; right: var(--space-4); bottom: var(--space-4);
    display: flex; flex-direction: column; gap: var(--space-2);
    z-index: 100; max-width: calc(100vw - 32px);
  }
  .toast {
    background: var(--ink); color: #fff;
    border-left: 5px solid var(--ok);
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
    box-shadow: var(--shadow-lg);
    font-weight: 500; min-width: 240px;
  }
  .toast.toast-warn  { border-left-color: var(--p-high); }
  .toast.toast-error { border-left-color: var(--p-critical); }
</style>
</head>
<body>

<!-- ============================================================
     Header: wordmark, actions, live summary strip, demo note
     ============================================================ -->
<header class="app-header">
  <div class="header-row">
    <h1 class="wordmark">UOB IT PMO <span>· Project Board</span></h1>
    <div class="header-actions">
      <span id="sending-indicator" class="sending-indicator" hidden>✉ Sending notification…</span>
      <button type="button" id="open-add" class="btn btn-light">+ Add Task</button>
    </div>
  </div>
  <dl class="summary" aria-label="Board summary">
    <div><dt>Total</dt><dd id="sum-total">0</dd></div>
    <div><dt>Backlog</dt><dd id="sum-backlog">0</dd></div>
    <div><dt>In Progress</dt><dd id="sum-in-progress">0</dd></div>
    <div><dt>Blocked</dt><dd id="sum-blocked">0</dd></div>
    <div><dt>Done</dt><dd id="sum-done">0</dd></div>
    <div class="sum-overdue"><dt>⚠ Overdue</dt><dd id="sum-overdue">0</dd></div>
  </dl>
  <p class="demo-note">Internal demo / training tool. Data is held in memory only, and refreshing the page resets the board to the demo tasks.</p>
</header>

<main>
  <!-- ============================================================
       Filter bar (client-side filtering over state.tasks)
       ============================================================ -->
  <section class="filters" aria-label="Filters">
    <div class="field">
      <label for="filter-project">Project</label>
      <select id="filter-project"><option value="">All projects</option></select>
    </div>
    <div class="field">
      <label for="filter-assignee">Assignee contains</label>
      <input type="search" id="filter-assignee" placeholder="e.g. Tan" autocomplete="off">
    </div>
    <div class="field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority"><option value="">All priorities</option></select>
    </div>
    <button type="button" id="clear-filters" class="btn">Clear filters</button>
  </section>

  <!-- ============================================================
       Kanban board (columns are rendered from STATUSES in JS)
       ============================================================ -->
  <section id="board" class="board" aria-label="Kanban board"></section>
</main>

<!-- ============================================================
     Add Task dialog
     ============================================================ -->
<dialog id="add-dialog" aria-labelledby="add-dialog-title">
  <div class="dialog-header">
    <h2 id="add-dialog-title">Add Task</h2>
    <button type="button" class="icon-btn" id="close-add" aria-label="Close Add Task dialog">×</button>
  </div>
  <form id="task-form" class="task-form" novalidate>
    <div class="form-grid">
      <div class="form-field full">
        <label for="f-title">Task Title <span class="req" aria-hidden="true">*</span> <span class="hint">(max 80)</span></label>
        <input type="text" id="f-title" name="title" maxlength="80" required aria-describedby="err-title">
        <p class="field-error" id="err-title"></p>
      </div>
      <div class="form-field full">
        <label for="f-description">Description <span class="hint">(optional, max 500)</span></label>
        <textarea id="f-description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
        <p class="field-error" id="err-description"></p>
      </div>
      <div class="form-field">
        <label for="f-project">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
        <select id="f-project" name="project" required aria-describedby="err-project"></select>
        <p class="field-error" id="err-project"></p>
      </div>
      <div class="form-field">
        <label for="f-category">Category <span class="req" aria-hidden="true">*</span></label>
        <select id="f-category" name="category" required aria-describedby="err-category"></select>
        <p class="field-error" id="err-category"></p>
      </div>
      <div class="form-field">
        <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
        <input type="text" id="f-assignee" name="assignee" maxlength="60" required aria-describedby="err-assignee">
        <p class="field-error" id="err-assignee"></p>
      </div>
      <div class="form-field">
        <label for="f-priority">Priority</label>
        <select id="f-priority" name="priority" aria-describedby="err-priority"></select>
        <p class="field-error" id="err-priority"></p>
      </div>
      <div class="form-field">
        <label for="f-dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
        <input type="date" id="f-dueDate" name="dueDate" required aria-describedby="err-dueDate">
        <p class="field-error" id="err-dueDate"></p>
      </div>
      <div class="form-field">
        <label for="f-status">Status</label>
        <select id="f-status" name="status" aria-describedby="err-status"></select>
        <p class="field-error" id="err-status"></p>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" id="cancel-add" class="btn">Cancel</button>
      <button type="submit" id="submit-task" class="btn btn-primary">Add Task</button>
    </div>
  </form>
</dialog>

<!-- Toast region (announced politely to screen readers) -->
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<!--
  FormSubmit configuration: set FORMSUBMIT_ENDPOINT at the top of the script below.
  FormSubmit needs a one-time activation. The FIRST submission to a new address sends
  a confirmation email to that address, and submissions are only delivered after the
  activation link in that email has been clicked.
-->
<script>
"use strict";

/* ============================================================
   CONFIG: change the email address here (one place only)
   ============================================================ */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

const STATUSES = [
  { name: "Backlog",     hint: "Logged, not yet scheduled" },
  { name: "In Progress", hint: "Actively being worked" },
  { name: "Blocked",     hint: "Waiting on a dependency, vendor or approval" },
  { name: "Done",        hint: "Completed / closed" },
];
const PROJECTS = [
  "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
  "Data & Analytics", "Infrastructure & Cloud", "Vendor Management",
];
const CATEGORIES = [
  "Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ============================================================
   STATE: single source of truth (memory only, no storage APIs)
   ============================================================ */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
};
let nextId = 1;

// UI-only state that affects rendering (not task data)
const ui = {
  pendingDelete: null, // id of the card showing the "Delete? Yes / No" toggle
  focusAfterRender: null, // CSS selector to focus after the next renderBoard()
  inFlight: 0, // number of FormSubmit requests in progress
};

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function generateId() {
  return "UOB-ITPM-" + String(nextId++).padStart(4, "0");
}

// Local-date ISO string (YYYY-MM-DD); avoids UTC off-by-one from toISOString()
function toLocalISO(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function todayISO() {
  return toLocalISO(new Date());
}

function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return toLocalISO(d);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function slug(text) {
  return text.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function fillSelect(select, values, placeholder) {
  const opts = placeholder ? [`<option value="">${escapeHtml(placeholder)}</option>`] : [];
  values.forEach(v => opts.push(`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
  select.insertAdjacentHTML("beforeend", opts.join(""));
}

/* ============================================================
   SEED DATA: 8 demo tasks, due dates relative to today
   ============================================================ */
function seedTasks() {
  const seeds = [
    { title: "Migrate FX pricing service to AWS", description: "Lift-and-shift of the FX rate pricing engine to the AWS landing zone, with blue/green cut-over.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Wei Ling Tan", priority: "High", dueDate: addDays(12), status: "In Progress" },
    { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Apply vendor hotfix to the teller VDI golden image and roll it out to all branches.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Arjun Nair", priority: "Critical", dueDate: addDays(-2), status: "In Progress" },
    { title: "UAT sign-off for mobile onboarding release 4.2", description: "Waiting on business sign-off after eKYC regression defects are retested.", project: "Digital Channels", category: "Application Development", assignee: "Siti Rahman", priority: "High", dueDate: addDays(-1), status: "Blocked" },
    { title: "SWIFT CSP control attestation", description: "Collect evidence for the mandatory controls and prepare the annual attestation pack.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Marcus Lim", priority: "High", dueDate: addDays(30), status: "Backlog" },
    { title: "Vendor SLA review — card processor", description: "Quarterly SLA review; pending the vendor's incident RCA report.", project: "Vendor Management", category: "Vendor", assignee: "Priya Das", priority: "Medium", dueDate: addDays(5), status: "Blocked" },
    { title: "Data lake PII masking pipeline", description: "Build a tokenisation step for customer PII before ingestion into the analytics zone.", project: "Data & Analytics", category: "Data", assignee: "Kenji Ho", priority: "Low", dueDate: addDays(21), status: "Backlog" },
    { title: "Firewall rule recertification", description: "Semi-annual review of the DC perimeter firewall rulebase with application owners.", project: "Infrastructure & Cloud", category: "Cybersecurity", assignee: "Daniel Goh", priority: "Low", dueDate: addDays(-7), status: "Done" },
    { title: "Core banking batch window tuning", description: "Reduce the end-of-day batch runtime by parallelising the interest accrual jobs.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Nurul Aziz", priority: "Medium", dueDate: addDays(-3), status: "Done" },
  ];
  state.tasks = seeds.map(s => ({ id: generateId(), ...s }));
}

/* ============================================================
   FILTERING
   ============================================================ */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter(t =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

function filtersActive() {
  const f = state.filters;
  return Boolean(f.project || f.priority || f.assignee.trim());
}

/* ============================================================
   RENDERING (all card DOM is produced here from state)
   ============================================================ */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = slug(task.priority);
  const overdue = isOverdue(task);
  const moveOptions = STATUSES
    .filter(s => s.name !== task.status)
    .map(s => `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`)
    .join("");

  const deleteControl = ui.pendingDelete === task.id
    ? `<div class="confirm-row" role="group" aria-label="Confirm delete ${id}">
         <span>Delete?</span>
         <button type="button" class="btn btn-sm btn-danger" data-action="confirm-delete">Yes</button>
         <button type="button" class="btn btn-sm" data-action="cancel-delete">No</button>
       </div>`
    : "";

  return `
    <article class="card prio-${prio}" draggable="true" data-id="${id}" aria-label="${id}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="card-id">${id}</span>
        <span class="pill" title="Priority">${escapeHtml(task.priority)}</span>
        ${overdue ? `<span class="badge-overdue">⚠ Overdue</span>` : ""}
        <button type="button" class="icon-btn" data-action="delete" aria-label="Delete task ${id}">×</button>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      ${task.description ? `<p class="card-desc">${escapeHtml(task.description)}</p>` : ""}
      <dl class="card-meta">
        <dt>Project</dt><dd>${escapeHtml(task.project)}</dd>
        <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
        <dt>Due</dt><dd><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
      </dl>
      <div class="card-foot">
        <span class="tag">${escapeHtml(task.category)}</span>
        <select class="move-select" data-action="move" aria-label="Move task ${id} to another column">
          <option value="">Move ▸</option>
          ${moveOptions}
        </select>
      </div>
      ${deleteControl}
    </article>`;
}

function renderSummary() {
  const counts = Object.fromEntries(STATUSES.map(s => [s.name, 0]));
  state.tasks.forEach(t => { counts[t.status]++; });
  document.getElementById("sum-total").textContent = state.tasks.length;
  STATUSES.forEach(s => {
    document.getElementById("sum-" + slug(s.name)).textContent = counts[s.name];
  });
  document.getElementById("sum-overdue").textContent = state.tasks.filter(isOverdue).length;
}

function renderBoard() {
  const board = document.getElementById("board");
  const visible = applyFilters(state.tasks);
  const filtering = filtersActive();

  board.innerHTML = STATUSES.map(s => {
    const all = state.tasks.filter(t => t.status === s.name);
    const shown = visible.filter(t => t.status === s.name);
    const countText = filtering ? `${shown.length} / ${all.length}` : String(all.length);
    const headingId = "col-" + slug(s.name);
    return `
      <section class="column" data-status="${escapeHtml(s.name)}" aria-labelledby="${headingId}">
        <div class="column-header">
          <div>
            <h2 id="${headingId}">${escapeHtml(s.name)}</h2>
            <p class="column-hint">${escapeHtml(s.hint)}</p>
          </div>
          <span class="count-badge" aria-label="${escapeHtml(countText)} tasks">${escapeHtml(countText)}</span>
        </div>
        <div class="card-list">
          ${shown.length ? shown.map(renderCard).join("") : `<p class="empty">No tasks</p>`}
        </div>
      </section>`;
  }).join("");

  renderSummary();

  // Restore keyboard focus after a re-render (move / delete toggle)
  if (ui.focusAfterRender) {
    const el = board.querySelector(ui.focusAfterRender);
    if (el) el.focus();
    ui.focusAfterRender = null;
  }
}

/* ============================================================
   ACTIONS (mutate state, then re-render)
   ============================================================ */
function addTask(data) {
  const task = { id: generateId(), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = state.tasks.find(t => t.id === id);
  if (!task || task.status === status || !STATUSES.some(s => s.name === status)) return;
  task.status = status;
  ui.pendingDelete = null;
  renderBoard();
  showToast(`${task.id} moved to ${status}`, "success");
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  ui.pendingDelete = null;
  renderBoard();
  showToast(`${id} deleted`, "success");
}

/* ============================================================
   TOASTS
   ============================================================ */
function showToast(message, type = "success") {
  const region = document.getElementById("toasts");
  const toast = document.createElement("div");
  toast.className = "toast toast-" + type;
  toast.textContent = (type === "success" ? "✓ " : "⚠ ") + message;
  region.appendChild(toast);
  setTimeout(() => toast.remove(), type === "success" ? 3500 : 6000);
}

/* ============================================================
   FORMSUBMIT: email notification (AJAX, never navigates)
   ============================================================ */
async function notifyNewTask(task) {
  if (FORMSUBMIT_ENDPOINT.includes("YOUR_EMAIL@example.com")) {
    throw new Error("FormSubmit endpoint not configured");
  }
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  const json = await res.json();
  if (json && (json.success === false || json.success === "false")) {
    throw new Error("FormSubmit rejected: " + (json.message || "unknown"));
  }
  return json;
}

function setSending(isSending) {
  ui.inFlight += isSending ? 1 : -1;
  const busy = ui.inFlight > 0;
  const btn = document.getElementById("submit-task");
  btn.disabled = busy;
  btn.textContent = busy ? "Sending…" : "Add Task";
  document.getElementById("sending-indicator").hidden = !busy;
}

/* ============================================================
   FORM: validation & submit
   ============================================================ */
const form = document.getElementById("task-form");
const dialog = document.getElementById("add-dialog");

function readForm() {
  const v = name => form.elements[name].value;
  return {
    title: v("title").trim(),
    description: v("description").trim(),
    project: v("project"),
    category: v("category"),
    assignee: v("assignee").trim(),
    priority: v("priority"),
    dueDate: v("dueDate"),
    status: v("status"),
  };
}

function setFieldError(name, message) {
  const input = form.elements[name];
  document.getElementById("err-" + name).textContent = message;
  if (message) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
}

function clearErrors() {
  ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"]
    .forEach(n => setFieldError(n, ""));
}

function validateForm(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Task title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";
  if (!STATUSES.some(s => s.name === data.status)) errors.status = "Choose a status.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";

  clearErrors();
  Object.entries(errors).forEach(([name, msg]) => setFieldError(name, msg));
  const first = Object.keys(errors)[0];
  if (first) form.elements[first].focus();
  return !first;
}

async function handleSubmit(event) {
  event.preventDefault();
  if (ui.inFlight > 0) return;
  const data = readForm();
  if (!validateForm(data)) return;

  // Optimistic UI: the card appears immediately
  const task = addTask(data);
  form.reset();
  clearErrors();
  dialog.close();
  showToast(`Task ${task.id} added`, "success");

  // Email notification in parallel; failure never breaks the board
  setSending(true);
  try {
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}`, "success");
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warn");
  } finally {
    setSending(false);
  }
}

function openAddDialog() {
  form.elements.dueDate.min = todayISO();
  clearErrors();
  dialog.showModal();
  form.elements.title.focus();
}

/* ============================================================
   DRAG & DROP (native HTML5 API, delegated on the board)
   ============================================================ */
function clearDropTargets() {
  document.querySelectorAll(".column.is-drop-target")
    .forEach(c => c.classList.remove("is-drop-target"));
}

function wireDragAndDrop(board) {
  board.addEventListener("dragstart", e => {
    const card = e.target.closest && e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("is-dragging");
  });

  board.addEventListener("dragover", e => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault(); // allow drop
    e.dataTransfer.dropEffect = "move";
    if (!column.classList.contains("is-drop-target")) {
      clearDropTargets();
      column.classList.add("is-drop-target");
    }
  });

  board.addEventListener("dragleave", e => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("is-drop-target");
  });

  board.addEventListener("drop", e => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    clearDropTargets();
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveTask(id, column.dataset.status);
  });

  board.addEventListener("dragend", () => {
    clearDropTargets();
    board.querySelectorAll(".card.is-dragging").forEach(c => c.classList.remove("is-dragging"));
  });
}

/* ============================================================
   CARD CONTROLS: delete toggle & keyboard "Move ▸" fallback
   ============================================================ */
function wireCardControls(board) {
  board.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.closest(".card").dataset.id;
    const sel = `.card[data-id="${CSS.escape(id)}"]`;

    switch (btn.dataset.action) {
      case "delete":
        ui.pendingDelete = id;
        ui.focusAfterRender = `${sel} [data-action="cancel-delete"]`;
        renderBoard();
        break;
      case "cancel-delete":
        ui.pendingDelete = null;
        ui.focusAfterRender = `${sel} [data-action="delete"]`;
        renderBoard();
        break;
      case "confirm-delete":
        deleteTask(id);
        break;
    }
  });

  board.addEventListener("change", e => {
    const select = e.target.closest('select[data-action="move"]');
    if (!select || !select.value) return;
    const id = select.closest(".card").dataset.id;
    ui.focusAfterRender = `.card[data-id="${CSS.escape(id)}"] .move-select`;
    moveTask(id, select.value);
  });
}

/* ============================================================
   FILTER BAR
   ============================================================ */
function wireFilters() {
  const project = document.getElementById("filter-project");
  const assignee = document.getElementById("filter-assignee");
  const priority = document.getElementById("filter-priority");

  project.addEventListener("change", () => { state.filters.project = project.value; renderBoard(); });
  priority.addEventListener("change", () => { state.filters.priority = priority.value; renderBoard(); });
  assignee.addEventListener("input", () => { state.filters.assignee = assignee.value; renderBoard(); });

  document.getElementById("clear-filters").addEventListener("click", () => {
    state.filters = { project: "", assignee: "", priority: "" };
    project.value = ""; assignee.value = ""; priority.value = "";
    renderBoard();
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  // Populate selects from config constants
  fillSelect(document.getElementById("filter-project"), PROJECTS);
  fillSelect(document.getElementById("filter-priority"), PRIORITIES);
  fillSelect(form.elements.project, PROJECTS, "Select project…");
  fillSelect(form.elements.category, CATEGORIES, "Select category…");
  fillSelect(form.elements.priority, PRIORITIES);
  fillSelect(form.elements.status, STATUSES.map(s => s.name));

  // Defaults that form.reset() restores
  form.elements.priority.querySelector('option[value="Medium"]').defaultSelected = true;
  form.elements.status.querySelector('option[value="Backlog"]').defaultSelected = true;
  form.reset();

  // Wire events
  const board = document.getElementById("board");
  wireDragAndDrop(board);
  wireCardControls(board);
  wireFilters();
  form.addEventListener("submit", handleSubmit);
  document.getElementById("open-add").addEventListener("click", openAddDialog);
  document.getElementById("close-add").addEventListener("click", () => dialog.close());
  document.getElementById("cancel-add").addEventListener("click", () => dialog.close());

  seedTasks();
  renderBoard();
}

init();
</script>
